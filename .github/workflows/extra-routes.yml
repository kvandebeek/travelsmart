name: Extra route stream (every 5 minutes)

# One pseudo-random route from `extra_routes` in config/commute_schedule.yaml
# every 5 minutes during the peaks. Collects and commits only; the main
# workflow publishes the dashboard at its own slots.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 5-8 * * 1-5'
      timezone: Europe/Brussels
    - cron: '*/5 14-17 * * 1-5'
      timezone: Europe/Brussels

permissions:
  contents: write

concurrency:
  group: extra-route-stream  # separate queue: never displaces a regular slot run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The API keys are environment secrets of the "Master" environment.
    environment: Master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Collect the due extra route
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEY2: ${{ secrets.TOMTOM_API_KEY2 }}
        run: python scripts/run_commute_tick.py --stream extra --execute
      - name: Commit observation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A observations
          if ! git diff --cached --quiet; then
            git commit -m "Record extra commute observation"
            # Both workflows commit here; retry if the other one pushed in between.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 5))
            done
          fi
