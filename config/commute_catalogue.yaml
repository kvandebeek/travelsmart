# A corridor node is an exact shared road-access point to choose later.
corridor_nodes:
  brussels_e40: E40 corridor east of Brussels; exact road-access point pending
  leuven_e40: E40 corridor near Leuven; exact road-access point pending
  ghent_e40: E40 corridor near Ghent; exact road-access point pending

# Sparse long journeys worth observing directly as calibration. Ids are
# <town>.<place> from commute_homes.yaml and <town>.<id> from work_places.
long_distance_watchlist:
  - {home: maaseik.neeroeteren, work: oostende.plassendale, corridor: [brussels_e40]}
  - {home: maaseik.neeroeteren, work: brussels.european_quarter, corridor: [leuven_e40]}
  - {home: brussels.anderlecht, work: oostende.plassendale, corridor: [ghent_e40]}
  - {home: bilzen.hoeselt_centrum, work: brussels.european_quarter, corridor: [leuven_e40]}
