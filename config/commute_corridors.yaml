# Motorway corridors measured as one TomTom route with intermediate stops. Each call returns
# the travel time per leg; any pair of points along a corridor can then be estimated from
# its legs (time-shifted: a later leg is driven later in the trip).
#
# nodes: in travel order (forward direction). `town` = a map town (its map point is used
#   for the end points); `query` = an OpenStreetMap search for places outside the catalogue.
#   Intermediate nodes become the motorway point nearest that place, on the carriageway of
#   the direction of travel (scripts/build_corridors.py).
# guide: towns the OpenStreetMap route must pass, so it follows the intended motorways.
corridors:
  - id: liege_ghent
    name: Liège – Ghent (E313 · E314 · E40)
    motorways: ["E 313", "E 314", "E 40", "R 0"]
    guide: [liege, hasselt, leuven, ghent]
    nodes:
      - {id: liege, name: Liège, town: liege}
      - {id: tongeren, name: Tongeren, query: "Tongeren"}
      - {id: bilzen, name: Bilzen, town: bilzen}
      - {id: diepenbeek, name: Diepenbeek, town: diepenbeek}
      - {id: hasselt, name: Hasselt, town: hasselt}
      - {id: lummen, name: Lummen, query: "Lummen"}
      - {id: diest, name: Diest, query: "Diest"}
      - {id: aarschot, name: Aarschot, query: "Aarschot"}
      - {id: leuven, name: Leuven, town: leuven}
      - {id: brussels, name: Brussels ring, town: brussels}
      - {id: aalst, name: Aalst, town: aalst}
      - {id: ghent, name: Ghent, town: ghent}
  - id: e314
    name: E314 Leuven – Maasmechelen
    motorways: ["E 314"]
    guide: [leuven, maasmechelen]
    nodes:
      - {id: leuven, name: Leuven, town: leuven}
      - {id: aarschot, name: Aarschot, query: "Aarschot"}
      - {id: diest, name: Diest, query: "Diest"}
      - {id: lummen, name: Lummen, query: "Lummen"}
      - {id: houthalen, name: Houthalen-Helchteren, query: "Houthalen-Helchteren"}
      - {id: genk, name: Genk, town: genk}
      - {id: maasmechelen, name: Maasmechelen, town: maasmechelen}
