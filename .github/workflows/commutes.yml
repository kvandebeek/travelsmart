name: Commute observations and dashboard

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    # UTC on purpose: the planner works in Brussels time (summer and winter time),
    # so a run with no slot due exits without API calls. 03:00-16:55 UTC covers
    # 05:00-17:30 Brussels in both CET and CEST. Must cover every slot (tests check).
    - cron: '*/5 3-16 * * 1-5'
    - cron: '10 10 * * *'   # daily weather join

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: commute-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The API keys are environment secrets of the "Master" environment.
    environment: Master
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Check API key secrets are present
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEY2: ${{ secrets.TOMTOM_API_KEY2 }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: |
          # Reports presence only; values are never printed.
          for name in TOMTOM_API_KEY TOMTOM_API_KEY2 HERE_API_KEY; do
            if [ -n "${!name}" ]; then echo "::notice::$name is set"; else echo "::warning::$name is missing"; fi
          done
      - name: Collect a due commute slot
        if: github.event_name != 'push' && github.event.schedule != '10 10 * * *'
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEY2: ${{ secrets.TOMTOM_API_KEY2 }}
        run: python scripts/run_commute_tick.py --execute
      - name: Collect a small HERE comparison sample
        if: github.event_name != 'push' && github.event.schedule != '10 10 * * *'
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: python scripts/run_commute_tick.py --provider here --execute
      - name: Add historical weather to completed observations
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 10 * * *'
        run: python scripts/enrich_commute_weather.py
      - name: Commit observation files
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A observations
          if ! git diff --cached --quiet; then
            git commit -m "Record commute observations"
            # Both workflows commit here; retry if the other one pushed in between.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: collect
    # Code pushes and manual runs always publish; scheduled runs only when they stored data.
    if: github.event_name != 'schedule' || needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy  # shared with the extra stream; the newest waiting deploy wins
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # branch head, including the observations just committed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Build static dashboard data
        run: |
          python -m travelsmart export
          python scripts/export_commutes.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
