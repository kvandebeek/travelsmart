timezone: Europe/Brussels
morning_slots: ["05:00", "05:20", "05:40", "06:00", "06:20", "06:40", "06:55", "07:10", "07:25", "07:40", "07:55", "08:10", "08:25", "08:40", "09:00"]
evening_slots: ["14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00"]

# Two separate TomTom accounts. Morning calls use the first, evening calls the
# second. Each account has its own reserve for manual checks and failures.
tomtom_accounts:
  morning: {id: tomtom_morning, key_env: TOMTOM_API_KEY, monthly_limit: 20000, reserve: 2000}
  evening: {id: tomtom_evening, key_env: TOMTOM_API_KEY2, monthly_limit: 20000, reserve: 2000}
# Every non-core route gets one sample per slot each month. Up to this many
# routes get a second sample per slot, on a different working day.
extra_rotating_routes_per_month: 300
# HERE Base Plan has a card on file: anything above the free tier is billed.
# The lowest published free allowance for car routing is 5,000 transactions a
# month, so both caps stay well under it: 4 routes x 24 slots = 96 a day, and a
# hard monthly stop at 3,000 even if manual runs are added. Every attempt counts,
# including failed ones.
here_daily_limit: 96
here_monthly_limit: 3000
here_routes_per_slot: 4

# Only the ten national statutory dates are computed automatically. Company or
# sector replacement days can be added here as YYYY-MM-DD dates.
extra_excluded_dates: []

# Priority town pairs, measured in every slot. Each slot uses one of the pair's
# start place -> employment area routes, rotating over days and slots; all of them
# feed the same town record. build_commute_catalogue.py makes sure every start
# place of the home town has a route to the destination town.
core_routes:
  - diepenbeek__brussels
  - diepenbeek__leuven
  - hasselt__brussels
  - bilzen__brussels
  - beringen__leuven
  - ghent__brussels
  - aalst__brussels
  - mechelen__brussels
  - leuven__brussels
  - antwerp__brussels
  - bruges__ghent
  - oostende__bruges
  - kortrijk__ghent
  - roeselare__bruges
  - ieper__kortrijk
  - turnhout__antwerp
  - lommel__hasselt
  - charleroi__brussels
  - namur__brussels
  - genk__brussels
