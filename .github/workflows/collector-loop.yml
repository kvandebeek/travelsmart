name: Collector loop

# One long job measures everything that becomes due (scripts/collector_loop.py), so collection
# does not depend on GitHub firing a 5-minute schedule. Hourly start attempts: one loop runs,
# one waits; when a loop ends (about 6 hours, or after 18:00 Brussels time) the next takes over.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 2-16 * * 1-5'   # UTC; covers 05:00-17:45 Brussels in summer and winter time

permissions:
  contents: write
  actions: write   # to start publish.yml

concurrency:
  group: collector-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # The API keys are environment secrets of the "Master" environment.
    environment: Master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Collect everything that becomes due
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_API_KEY2: ${{ secrets.TOMTOM_API_KEY2 }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/collector_loop.py
