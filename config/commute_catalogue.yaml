# Commute catalogue: towns, their employment areas and the rules that pair them
# with residential start places (config/commute_homes.yaml, from Statbel).
# scripts/build_commute_catalogue.py geocodes/snaps every point, measures road
# distances and writes config/commute_routes.csv and config/commute_anchors.yaml.
minimum_distance_km: 12                 # road distance; shorter routes are dropped
candidate_minimum_straight_line_km: 16  # pre-filter before asking a router
maximum_regular_straight_line_km: 125
nearby_work_places_per_home: 8
hub_work_places_per_home: 4
max_work_places_per_town: 2             # per start place, so Brussels is not 5 of its 12
regional_hubs: [antwerp, hasselt, genk, ghent, bruges, kortrijk, leuven, brussels, liege, namur, charleroi]

areas:
  antwerp: {name: Antwerp, region: antwerp}
  mechelen: {name: Mechelen, region: antwerp}
  turnhout: {name: Turnhout, region: antwerp}
  geel: {name: Geel, region: antwerp}
  mol: {name: Mol, region: antwerp}
  diepenbeek: {name: Diepenbeek, region: limburg}
  hasselt: {name: Hasselt, region: limburg}
  genk: {name: Genk, region: limburg}
  beringen: {name: Beringen, region: limburg}
  lommel: {name: Lommel, region: limburg}
  maasmechelen: {name: Maasmechelen, region: limburg}
  kinrooi: {name: Kinrooi, region: limburg}
  hamont_achel: {name: Hamont-Achel, region: limburg}
  maaseik: {name: Maaseik, region: limburg}
  bilzen: {name: Bilzen-Hoeselt, region: limburg}
  ghent: {name: Ghent, region: east_flanders}
  aalst: {name: Aalst, region: east_flanders}
  sint_niklaas: {name: Sint-Niklaas, region: east_flanders}
  oostende: {name: Oostende, region: west_flanders}
  bruges: {name: Bruges, region: west_flanders}
  kortrijk: {name: Kortrijk, region: west_flanders}
  roeselare: {name: Roeselare, region: west_flanders}
  ieper: {name: Ieper, region: west_flanders}
  leuven: {name: Leuven, region: flemish_brabant}
  vilvoorde: {name: Vilvoorde, region: flemish_brabant}
  halle: {name: Halle, region: flemish_brabant}
  brussels: {name: Brussels, region: brussels}
  liege: {name: Liège, region: wallonia}
  namur: {name: Namur, region: wallonia}
  charleroi: {name: Charleroi, region: wallonia}
  mons: {name: Mons, region: wallonia}
  tournai: {name: Tournai, region: wallonia}
  wavre: {name: Wavre, region: wallonia}

# Employment areas. `point` = already verified [lat, lon]; otherwise `query` is
# looked up in OpenStreetMap Nominatim (first hit within 15 km of the town).
# Bigger towns get 2-3 areas; small towns keep one.
work_places:
  antwerp:
    - {id: berchem_offices, name: Berchem office district, point: [51.199554, 4.432726]}
    - {id: port, name: Port of Antwerp (Noorderlaan), query: "Noorderlaan, Antwerpen"}
    - {id: kievit_offices, name: Kievit office district, query: "Kievitplein, Antwerpen"}
  mechelen:
