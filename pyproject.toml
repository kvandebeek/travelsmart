[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelsmart"
version = "0.1.0"
description = "Configurable Belgian baseline travel-time index"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0",
  "pydantic>=2.0", "PyYAML>=6.0", "httpx>=0.27", "APScheduler>=3.10"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["travelsmart*"]
